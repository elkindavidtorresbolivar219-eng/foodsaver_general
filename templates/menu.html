<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Meraki</title>
  <meta name="description" content="Menú de Meraki: hamburguesas, perros, picadas, bebidas y adiciones.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --dark:#11101D; --card:#211F2D; --gold:#FFB914; --gold-light:#FFC83D; --white:#fff; --border:#34313F; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--dark); color:var(--white); font-family:"Poppins",Arial,sans-serif; min-height:100vh; }
    header { padding:28px 16px 8px; text-align:center; }
    header h1 { font-family:"Montserrat",Arial,sans-serif; font-size:34px; font-weight:800; letter-spacing:1px; }
    header h1 span { color:var(--gold); }
    header p { margin-top:6px; color:#C7C5CC; font-size:14px; }
    main { max-width:520px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:18px; }
    .pagina { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; cursor:zoom-in; }
    .pagina img { display:block; width:100%; height:auto; }
    .pagina small { display:block; padding:8px; text-align:center; color:#C7C5CC; font-size:12px; }
    .acciones { position:sticky; bottom:0; padding:12px 16px 16px; background:linear-gradient(transparent, var(--dark) 40%); text-align:center; }
    .btn { display:inline-block; padding:14px 26px; border-radius:12px; background:var(--gold); color:var(--dark);
           font-family:"Montserrat",Arial,sans-serif; font-weight:800; font-size:15px; text-decoration:none; }
    .btn:active { background:var(--gold-light); }
    .visor { position:fixed; inset:0; z-index:10; display:none; background:rgba(0,0,0,.95); overflow:auto; padding:12px; cursor:zoom-out; }
    .visor.abierto { display:block; }
    .visor img { display:block; width:100%; max-width:900px; margin:0 auto; height:auto; }
  </style>
</head>
<body>
  <header>
    <h1>MENÚ <span>MERAKI</span></h1>
    <p>Toca una imagen para verla en grande</p>
  </header>

  <main>
    <div class="pagina">
      <img src="data:image/webp;base64,iܕyjvmZo׾}zۭ_{mw}iyM[᧿" alt="Menú Meraki: perros y hamburguesas" loading="lazy">
      <small>Perros y hamburguesas</small>
    </div>
    <div class="pagina">
      <img src="data:image/webp;base64,iܕyjvmZo׾}z5ӝ{o:_<F}?" alt="Menú Meraki: bebidas y picadas" loading="lazy">
      <small>Bebidas y picadas</small>
    </div>
    <div class="pagina">
      <img src="data:image/webp;base64,iܕyjvmZo׾}z5ӝ{o:_<F}?" alt="Menú Meraki: pa' picar, pagos y adiciones" loading="lazy">
      <small>Pa' picar, pagos y adiciones</small>
    </div>
  </main>

  <div class="acciones">
    <a class="btn" href="https://wa.me/573001364954?text=Hola%2C%20quiero%20hacer%20un%20pedido" target="_blank" rel="noopener">Pedir domicilio</a>
  </div>

  <div class="visor" id="visor"><img id="visorImg" alt=""></div>

  <script>
    const visor = document.getElementById("visor");
    const visorImg = document.getElementById("visorImg");
    document.querySelectorAll(".pagina img").forEach(img => {
      img.parentElement.addEventListener("click", () => {
        visorImg.src = img.src; visorImg.alt = img.alt; visor.classList.add("abierto");
      });
    });
    visor.addEventListener("click", () => visor.classList.remove("abierto"));
    document.addEventListener("keydown", e => { if (e.key === "Escape") visor.classList.remove("abierto"); });
  </script>
</body>
</html>
